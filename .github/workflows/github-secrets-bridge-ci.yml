name: GitHub secrets bridge CI

on:
  push:
    branches:
      - feat/github-secrets-bridge
    paths:
      - "infra/github-secrets-bridge/**"
      - ".github/workflows/github-secrets-bridge-ci.yml"
  pull_request:
    paths:
      - "infra/github-secrets-bridge/**"
      - ".github/workflows/github-secrets-bridge-ci.yml"

permissions:
  contents: read

concurrency:
  group: github-secrets-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/github-secrets-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Policy tests
        run: npm test
