name: Supabase local Auth and RLS isolation tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/supabase-auth-rls.integration.mjs"
      - "tests/fixtures/supabase-local-baseline.sql"
      - ".github/workflows/supabase-auth-rls.yml"

permissions:
  contents: read

concurrency:
  group: supabase-auth-rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-and-rls:
    name: Ephemeral Supabase Auth and RLS integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Supabase CLI v3.2.0
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Verify CLI and initialize local-only project
        run: |
          supabase --version
          supabase init --yes

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Export only local Supabase credentials to this runner
        shell: bash
        run: |
          set -euo pipefail
          status="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p' | tail -n1)"
          anon_key="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY=//p' | tail -n1)"
          service_key="$(printf '%s\n' "$status" | sed -n 's/^SERVICE_ROLE_KEY=//p' | tail -n1)"
          test -n "$api_url"
          test -n "$anon_key"
          test -n "$service_key"
          case "$api_url" in http://127.0.0.1:*|http://localhost:*) ;; *) echo "Refusing non-local API URL"; exit 1 ;; esac
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_ANON_KEY=$anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
          } >> "$GITHUB_ENV"

      - name: Apply isolated schema baseline and selected migrations
        run: |
          set -euo pipefail
          supabase db query -f tests/fixtures/supabase-local-baseline.sql
          supabase db query -f supabase/migrations/20261025170000_stripe_webhook_test_events.sql
          supabase db query -f supabase/migrations/20261030005446_preview_reconcile_account_schema.sql
          supabase db query -f supabase/migrations/20261030005545_preview_consolidate_read_policies.sql

      - name: Run real Auth, session and cross-account RLS tests
        run: node tests/supabase-auth-rls.integration.mjs

      - name: Stop local stack and remove all ephemeral containers and volumes
        if: always()
        run: supabase stop --no-backup || true
