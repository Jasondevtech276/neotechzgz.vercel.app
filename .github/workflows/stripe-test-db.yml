name: Isolated Stripe test database

on:
  pull_request:
    paths:
      - "supabase/functions/stripe-webhook-test/**"
      - "supabase/migrations/20261025170000_stripe_webhook_test_events.sql"
      - ".github/workflows/stripe-test-db.yml"
      - "tsconfig.json"
  push:
    branches:
      - "audit/stripe-webhook-test-harness"
    paths:
      - "supabase/functions/stripe-webhook-test/**"
      - "supabase/migrations/20261025170000_stripe_webhook_test_events.sql"
      - ".github/workflows/stripe-test-db.yml"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-test-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migration-and-access-tests:
    name: PostgreSQL 17 migration, RLS and idempotency
    # Manual runs are restricted to the dedicated audit branch.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/audit/stripe-webhook-test-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neotech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neotech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: neotech_test
    steps:
      - name: Checkout test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Type-check Supabase Edge Function in Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.8

      - name: Validate Edge Function imports and types
        run: deno check --node-modules-dir=none supabase/functions/stripe-webhook-test/index.ts

      - name: Run isolated webhook handler security tests
        run: deno test --node-modules-dir=none supabase/functions/stripe-webhook-test/index.deno.ts

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create Supabase-compatible roles in the ephemeral database
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator LOGIN NOINHERIT PASSWORD 'ephemeral_authenticator_pw';
            END IF;
          END
          $$;
          GRANT anon, authenticated, service_role TO authenticator;
          GRANT USAGE ON SCHEMA public TO service_role;
          SQL

      - name: Apply isolated test migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025170000_stripe_webhook_test_events.sql

      - name: Assert RLS, least privilege and primary key
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            table_oid oid := 'public.stripe_webhook_test_events'::regclass;
          BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = table_oid) THEN
              RAISE EXCEPTION 'RLS is not enabled';
            END IF;
            IF has_table_privilege('anon', table_oid, 'SELECT')
              OR has_table_privilege('anon', table_oid, 'INSERT')
              OR has_table_privilege('authenticated', table_oid, 'SELECT')
              OR has_table_privilege('authenticated', table_oid, 'INSERT') THEN
              RAISE EXCEPTION 'Client roles unexpectedly have table access';
            END IF;
            IF NOT has_table_privilege('service_role', table_oid, 'INSERT')
              OR NOT has_table_privilege('service_role', table_oid, 'SELECT') THEN
              RAISE EXCEPTION 'service_role lacks required access';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint
              WHERE conrelid = table_oid AND contype = 'p'
            ) THEN
              RAISE EXCEPTION 'Event idempotency primary key is missing';
            END IF;
          END
          $$;
          SQL


      - name: Start ephemeral PostgREST and create a one-run service token
        run: |
          # This secret is generated only inside the ephemeral runner and never persisted as a repository secret.
          jwt_secret="$(openssl rand -hex 32)"
          export PGRST_JWT_SECRET="$jwt_secret"
          echo "::add-mask::$jwt_secret"
          echo "PGRST_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          docker run --detach --rm --name stripe-test-postgrest --network host \
            -e PGRST_DB_URI='postgres://authenticator:ephemeral_authenticator_pw@127.0.0.1:5432/neotech_test' \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=3001 \
            -e PGRST_JWT_SECRET="$jwt_secret" \
            postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3001/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs stripe-test-postgrest
              exit 1
            fi
            sleep 2
          done
          cat > /tmp/neotech-stripe-nginx.conf <<'NGINX'
          server {
            listen 127.0.0.1:3000;
            location /rest/v1/ {
              rewrite ^/rest/v1/(.*)$ /$1 break;
              proxy_pass http://127.0.0.1:3001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
            }
            location / {
              proxy_pass http://127.0.0.1:3001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
            }
          }
          NGINX
          docker run --detach --rm --name stripe-test-proxy --network host \
            --volume /tmp/neotech-stripe-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.31.8-alpine
          for attempt in $(seq 1 15); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/rest/v1/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker logs stripe-test-proxy
              docker logs stripe-test-postgrest
              exit 1
            fi
            sleep 1
          done
          token="$(node <<'NODE'
          const crypto = require("node:crypto");
          const secret = process.env.PGRST_JWT_SECRET;
          const b64 = (value) => Buffer.from(value).toString("base64url");
          const header = b64(JSON.stringify({ alg: "HS256", typ: "JWT" }));
          const now = Math.floor(Date.now() / 1000);
          const payload = b64(JSON.stringify({ role: "service_role", iat: now, exp: now + 900 }));
          const unsigned = header + "." + payload;
          const signature = crypto.createHmac("sha256", secret).update(unsigned).digest("base64url");
          process.stdout.write(unsigned + "." + signature);
          NODE
          )"
          echo "::add-mask::$token"
          echo "SUPABASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$token" >> "$GITHUB_ENV"
          echo "STRIPE_TEST_SECRET_KEY=sk_test_ci_placeholder" >> "$GITHUB_ENV"
          echo "STRIPE_TEST_WEBHOOK_SECRET=whsec_ci_ephemeral_only" >> "$GITHUB_ENV"

      - name: Run end-to-end handler to isolated PostgREST and PostgreSQL
        run: |
          if deno test --node-modules-dir=none --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,STRIPE_TEST_WEBHOOK_SECRET,STRIPE_TEST_SECRET_KEY --allow-net=127.0.0.1,127.0.0.1:3000 supabase/functions/stripe-webhook-test/index.e2e.ts; then
            echo "PASS: webhook HTTP -> Supabase REST -> isolated PostgreSQL"
          else
            docker logs stripe-test-postgrest
            exit 1
          fi

      - name: Stop ephemeral PostgREST
        if: always()
        run: docker rm --force stripe-test-proxy stripe-test-postgrest || true

      - name: Verify event insert and duplicate rejection
        run: |
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.stripe_webhook_test_events (event_id, event_type, payload_sha256) VALUES ('evt_ci_test_001', 'payment_intent.succeeded', repeat('a', 64));"
          count="$(psql -At -c "SELECT count(*) FROM public.stripe_webhook_test_events WHERE event_id = 'evt_ci_test_001';")"
          test "$count" = "1"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.stripe_webhook_test_events (event_id, event_type, payload_sha256) VALUES ('evt_ci_test_001', 'payment_intent.succeeded', repeat('b', 64));"; then
            echo "FAIL: duplicate event id was accepted"
            exit 1
          else
            echo "PASS: duplicate event id rejected by primary key"
          fi
