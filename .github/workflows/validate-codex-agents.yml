name: Validate Codex agents

on:
  pull_request:
    branches: [main]
    paths:
      - ".codex/agents/**"
      - ".codex/config.toml"
      - ".github/workflows/validate-codex-agents.yml"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - ".codex/agents/**"
      - ".codex/config.toml"
      - ".github/workflows/validate-codex-agents.yml"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Parse and validate agent TOML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          files = sorted(Path(".codex/agents").glob("*.toml"))
          if len(files) < 27:
              raise SystemExit(f"Expected at least 27 agent profiles; found {len(files)}")

          required = {"name", "description", "developer_instructions"}
          seen = set()
          for path in files:
              try:
                  data = tomllib.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"{path}: invalid TOML: {exc}") from exc
              missing = required - data.keys()
              if missing:
                  raise SystemExit(f"{path}: missing required keys: {sorted(missing)}")
              for key in required:
                  if not isinstance(data[key], str) or not data[key].strip():
                      raise SystemExit(f"{path}: {key} must be a non-empty string")
              name = data["name"].casefold()
              if name in seen:
                  raise SystemExit(f"{path}: duplicate agent name: {data['name']}")
              seen.add(name)

          print(f"Validated {len(files)} Codex agent profiles.")
          PY
