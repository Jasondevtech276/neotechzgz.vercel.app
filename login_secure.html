<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTechZGZ - Inicio de Sesión</title>
  
  <!-- Security Headers (injectados por servidor) -->
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-light: #f0f2f5;
      --cyan: #00d4aa;
      --violet: #a259ff;
      --cyan-dim: rgba(0, 212, 170, 0.8);
      --violet-dim: rgba(162, 89, 255, 0.8);
      --neon-cyan: #00ffff;
      --neon-violet: #ff00ff;
      --card-radius: 16px;
      --input-radius: 8px;
      --max-width: 380px;
      --font-primary: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --text-dark: #1a1a2e;
      --text-light: #ffffff;
    }
    
    .dark {
      --bg: var(--bg-dark);
      --text: var(--text-light);
    }
    
    .light {
      --bg: var(--bg-light);
      --text: var(--text-dark);
    }
    
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }
    
    /* Detectar modo del sistema */
    @media (prefers-color-scheme: light) {
      body.light { display: block; }
      body.dark { display: none; }
    }
    
    @media (prefers-color-scheme: dark) {
      body.dark { display: block; }
      body.light { display: none; }
    }
    
    .login-container {
      width: 100%;
      max-width: var(--max-width);
      padding: 1.5rem;
      text-align: center;
    }
    
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: var(--card-radius);
      padding: 2.5rem 2rem;
      max-width: var(--max-width);
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s;
    }
    
    .login-card:hover {
      border-color: rgba(162, 89, 255, 0.5);
    }
    
    h2 {
      color: var(--cyan);
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      margin-top: 0;
    }
    
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--cyan);
      font-size: 0.875rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: var(--input-radius);
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.3s, background 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--cyan);
      background: rgba(255, 255, 255, 0.12);
    }
    
    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .btn-login {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: #0a0a0f;
      border: none;
      border-radius: var(--input-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    
    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }
    
    .btn-login:hover::before {
      left: 100%;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 212, 170, 0.4);
    }
    
    .btn-login:active {
      transform: translateY(1px);
    }
    
    .toggle-mode {
      margin-top: 1.5rem;
      padding: 0.5rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--text);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.3s, border-color 0.3s;
    }
    
    .toggle-mode:hover {
      border-color: var(--cyan);
      background: rgba(0, 212, 170, 0.1);
    }
    
    .form-group.input-password {
      position: relative;
    }
    
    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      font-size: 1rem;
    }
    
    .toggle-password:hover {
      color: var(--cyan);
    }
    
    @media (max-width: 420px) {
      .login-container {
        padding: 1rem;
      }
      
      .login-card {
        padding: 2rem 1.5rem;
      }
      
      h2 {
        font-size: 1.25rem;
      }
    }
    
    /* Reducir animaciones en modo reducido */
    @media (prefers-reduced-motion: reduce) {
      .btn-login::before {
        display: none;
      }
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="login-container">
    <div class="login-card" role="form" aria-label="Login NeoTechZGZ">
      <h2>NeoTechZGZ</h2>
      
      <form id="loginForm" novalidate>
        <div class="form-group input-password">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" 
                 placeholder="Nombre de usuario"
                 autocomplete="username"
                 required>
        </div>
        
        <div class="form-group input-password">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" 
                 placeholder="••••••••"
                 autocomplete="current-password"
                 required>
          <button type="button" class="toggle-password" aria-label="Mostrar/Ocultar contraseña">
            👁️
          </button>
        </div>
        
        <button type="submit" class="btn-login">Conectar Servicio</button>
      </form>
      
      <div class="toggle-mode" onclick="toggleTheme()">
        Cambiar modo: <span id="modeText">Oscuro</span>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle
    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', newTheme);
      document.getElementById('modeText').textContent = newTheme.charAt(0).toUpperCase() + newTheme.slice(1);
      
      // Guardar preferencia
      localStorage.setItem('theme', newTheme);
    }
    
    // Restore saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.body.setAttribute('data-theme', savedTheme);
      document.getElementById('modeText').textContent = savedTheme.charAt(0).toUpperCase() + savedTheme.slice(1);
    }
    
    // Toggle password visibility
    const passwordInput = document.getElementById('password');
    const toggleBtn = passwordInput.previousElementSibling;
    
    toggleBtn.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
    });
    
    // Form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // Aquí iría la llamada al endpoint de autenticación
      // Por ahora, validación simple
      if (username && password) {
        // Submit form or call API
        this.submit();
      }
    });
  </script>
</body>
</html>
