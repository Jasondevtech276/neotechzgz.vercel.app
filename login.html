<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTechZGZ Login</title>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-light: #f5f7fa;
      --cyan: #00d4aa;
      --violet: #a259ff;
      --neon-cyan: rgba(0, 212, 170, 0.8);
      --neon-violet: rgba(162, 89, 255, 0.8);
      --text: #e0e0e8;
      --text-dim: #7a7a8e;
      --border: rgba(0, 212, 170, 0.3);
    }
    .dark {
      --bg: var(--bg-dark);
      --cyan-accent: var(--cyan);
      --violet-accent: var(--violet);
      --text-color: var(--text);
    }
    .light {
      --bg: var(--bg-light);
      --cyan-accent: #00b894;
      --violet-accent: #a855f7;
      --text-color: #1e293b;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s, color 0.4s;
    }
    .login-card {
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-violet);
      transition: box-shadow 0.4s, border-color 0.4s;
    }
    .light .login-card {
      background: rgba(255,255,255,0.9);
      border-color: rgba(0,184,148,0.3);
      box-shadow: 0 0 20px rgba(0,0,0,0.1), 0 0 10px var(--cyan-accent), 0 0 20px var(--violet-accent);
    }
    .login-card h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--cyan-accent), var(--violet-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 1rem;
      transition: border-color 0.3s, background 0.3s;
    }
    .light .form-group input {
      background: rgba(0,0,0,0.05);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--cyan-accent);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .btn-login {
      width: 100%;
      padding: 0.9rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, var(--cyan-accent), var(--violet-accent));
      border: none;
      border-radius: 8px;
      color: #0a0a0f;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-violet);
    }
    .toggle-mode {
      position: fixed;
      top: 1rem; right: 1rem;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 100;
    }
    .light .toggle-mode {
      background: rgba(255,255,255,0.3);
      border-color: rgba(0,0,0,0.2);
      color: #1e293b;
    }
    .hint {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    @media (max-width: 420px) {
      .login-card { margin: 1rem; padding: 2rem; }
    }
  </style>
</head>
<body>
  <label class="toggle-mode" for="mode-toggle">Modo claro</label>
  <input type="checkbox" id="mode-toggle" class="dark">
  
  <div class="login-card">
    <h2>NeoTechZGZ</h2>
    <form>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="usuario" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="contraseña" required>
      </div>
      <button type="submit" class="btn-login">Iniciar sesión</button>
      <p class="hint">© 2025 NeoTechZGZ. Todos los derechos reservados.</p>
    </form>
  </div>

  <script>
    (() => {
      const html = document.documentElement;
      const toggle = document.getElementById('mode-toggle');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      function setMode(isDark) {
        if (isDark) { html.classList.add('dark'); html.classList.remove('light'); } else { html.classList.add('light'); html.classList.remove('dark'); }
      }
      toggle.checked = prefersDark;
      setMode(prefersDark);
      toggle.addEventListener('change', () => setMode(toggle.checked));
    })();
  </script>
</body>
</html>
